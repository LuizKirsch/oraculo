# render.yaml (Exemplo com Cron Job para ingestão)
services:
  - type: web
    name: oraculo-api
    env: python
    dockerfilePath: Dockerfile
    buildCommand: ""
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 10000"
    ports:
      - 10000
    envVars:
      - key: OPENAI_API_KEY
        sync: false
    autoDeploy: true
    healthCheckPath: /docs
    plan: standard
    disks:
      - name: oraculo-data
        path: /app/db_oraculo

  # Serviço de ingestão como Cron Job
  - type: cron_job # Alterado de 'job' para 'cron_job'
    name: oraculo-ingestao-cron # Novo nome para o cron job
    env: python
    dockerfilePath: Dockerfile
    buildCommand: ""
    startCommand: "python app/ingestao.py"
    schedule: "0 0 * * *" # Exemplo: Roda todos os dias à meia-noite (UTC)
    autoDeploy: false
    disks:
      - name: oraculo-data
        path: /app/db_oraculo
    envVars:
      - key: OPENAI_API_KEY
        sync: false