services:
  oraculo-app:
    build: .
    container_name: oraculo-api
    ports:
      - "8002:8000"
    volumes:
      - ./oraculo_docs:/app/oraculo_docs
      - ./db_oraculo:/app/db_oraculo
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped